[project]
name = "chaejeom"
version = "0.1.0.dev0"
description = "Chaejeom: Unified Reference-free Evaluation for Korean RAG"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10"
keywords = [
    "rag",
    "rag-evaluation",
    "llm-evaluation",
    "llm-as-a-judge",
    "korean",
    "korean-nlp",
    "ragas",
    "deepeval",
    "trulens",
]
dependencies = [
    "pydantic>=2.1",
    "openai>=1.58.1",
    "numpy>=1.24",
    "kiwipiepy>=0.24",
    "pyyaml>=6",
    "rich>=13",
    "prompt-toolkit>=3.0.40",
]

[project.urls]
Homepage = "https://github.com/9cheol2/chaejeom"
Documentation = "https://github.com/9cheol2/chaejeom/blob/main/docs/README.md"
Issues = "https://github.com/9cheol2/chaejeom/issues"

[project.scripts]
chaejeom = "chaejeom.cli.main:main"
Chaejeom = "chaejeom.cli.main:main"
"채점" = "chaejeom.cli.main:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chaejeom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
