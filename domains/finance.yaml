name: 금융 정보
service: 투자자가 상장사 실적, 공시, 증권사 리포트를 묻는 금융 정보 챗봇
groundedness: 실적 수치는 기간, 단위, 연결/별도 기준까지 문맥과 같아야 맞는 것으로 본다.
context_relevance: 메모리 반도체를 물으면 D램, 낸드, HBM을 다룬 조각도 관련 있다. 2차전지처럼 테마를 물으면 그 테마에 속한 회사를 다룬 조각도 관련 있다. 낸드와 HBM처럼 하위 항목끼리는 다른 대상이다.
answer_relevance: 메모리 반도체를 물으면 D램, 낸드, HBM으로 답해도 같은 대상이다. 2차전지처럼 테마를 물으면 그 테마에 속한 회사로 답해도 같은 대상이다. 낸드를 물었는데 HBM으로 답하면 다른 대상이다.
